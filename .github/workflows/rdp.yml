name: Windows-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Setup RDP
        run: |
          net user runneradmin Password123
          net localgroup administrators runneradmin /add

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "Runner Active"
          Start-Sleep -Seconds 21600
